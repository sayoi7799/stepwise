name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      # 干净的机器上没有 mooncakes 的索引，moon check 会因为解析不到
      # 依赖（moonbitlang/x）直接失败，所以先把索引同步下来。
      - name: Sync registry index
        run: moon update

      - name: Check
        run: moon check

      - name: Format check
        run: moon fmt --check

      - name: Test
        run: moon test

      - name: Run the pipeline on the sample
        run: moon run cmd/main -- analyze samples/sample.txt --level 2
